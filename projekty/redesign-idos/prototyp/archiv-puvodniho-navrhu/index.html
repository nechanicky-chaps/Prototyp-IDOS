<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IDOS Redesign – Mobilní UX Prototyp (Vy.no & Konkurence)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            vy: {
              bg: '#04130f',
              card: '#0a231c',
              cardHover: '#0f2f26',
              input: '#061a14',
              mint: '#9be3d1',
              mintDark: '#2b5349',
              mintHover: '#b2edd9',
              text: '#f1f5f3',
              subtext: '#8aa69d',
              border: '#163b31'
            }
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.1); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
    .phone-frame {
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 12px #1f2937, 0 0 0 14px #374151;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-teal-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const IconArrowLeft = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M15 19l-7-7 7-7"/></svg>;
    const IconClose = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M6 18L18 6M6 6l12 12"/></svg>;
    const IconSwap = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>;
    const IconUser = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>;
    const IconFilter = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>;
    const IconClock = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>;
    const IconTrain = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h12a2 2 0 012 2v10a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm2 9h12M8 19l-2 2m10-2l2 2M9 8h.01M15 8h.01"/></svg>;
    const IconBus = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 17a2 2 0 100-4 2 2 0 000 4zm8 0a2 2 0 100-4 2 2 0 000 4zM4 6h16v8H4V6zm0 0l2-2h12l2 2"/></svg>;
    const IconStar = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>;
    const IconInfo = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" strokeWidth="2"/><path strokeLinecap="round" strokeWidth="2" d="M12 8h.01M12 11v5"/></svg>;
    function App() {
      const [selectedApp, setSelectedApp] = useState('vy');
      const [screen, setScreen] = useState('results');

      const [passengers, setPassengers] = useState({
        adult: 1,
        child: 0,
        childAge: '',
        student: 0,
        studentAge: '',
        senior: 0,
        military: 0
      });

      const [options, setOptions] = useState({
        bike: 0,
        pram: 0,
        wheelchair: 0,
        petSmall: 0,
        petBig: 0
      });

      const [selectedTrip, setSelectedTrip] = useState(null);

      const getSummaryString = () => {
        const parts = [];
        if (passengers.adult > 0) parts.push(`${passengers.adult} adult${passengers.adult > 1 ? 's' : ''}`);
        if (passengers.child > 0) parts.push(`${passengers.child} child${passengers.childAge ? ` (${passengers.childAge}y)` : ''}`);
        if (passengers.student > 0) parts.push(`${passengers.student} student${passengers.studentAge ? ` (${passengers.studentAge}y)` : ''}`);
        if (passengers.senior > 0) parts.push(`${passengers.senior} senior${passengers.senior > 1 ? 's' : ''}`);
        if (passengers.military > 0) parts.push(`${passengers.military} military`);
        return parts.length > 0 ? parts.join(', ') : '0 passengers';
      };

      const calculateTotalPrice = (baseNok = 399) => {
        let total = 0;
        total += passengers.adult * baseNok;
        total += passengers.child * Math.round(baseNok * 0.5);
        total += passengers.student * Math.round(baseNok * 0.75);
        total += passengers.senior * Math.round(baseNok * 0.5);
        total += passengers.military * Math.round(baseNok * 0.5);
        total += options.bike * 100;
        total += options.petBig * 100;
        return total > 0 ? total : baseNok;
      };

      const trips = [
        { id: 't1', dep: '11:39', arr: '13:16', dur: '1 h 37 min', type: 'train', line: 'RE11 Skien', detail: 'Train with Vy from Oslo S · Track 5', basePrice: 399 },
        { id: 't2', dep: '11:54', arr: '13:47', dur: '1 h 53 min', type: 'bus', line: 'VY190 express', detail: '12:00 Bus with Vy express from Oslo bussterminal', basePrice: 430 },
        { id: 't3', dep: '12:39', arr: '14:16', dur: '1 h 37 min', type: 'train', line: 'RE11 Skien', detail: 'Train with Vy from Oslo S · Track 5', basePrice: 399 },
        { id: 't4', dep: '13:39', arr: '15:16', dur: '1 h 37 min', type: 'train', line: 'RE11 Skien', detail: 'Train with Vy from Oslo S · Track 5', basePrice: 399 }
      ];

      return (
        <div className="flex flex-col min-h-screen">
          <header className="bg-slate-900 border-b border-slate-800 px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-30 shadow-md">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-teal-500 to-emerald-400 flex items-center justify-center font-black text-slate-950 text-xl shadow-lg shadow-teal-500/20">
                V
              </div>
              <div>
                <h1 className="font-bold text-lg text-white flex items-center gap-2">
                  IDOS Redesign <span className="text-xs px-2 py-0.5 rounded-full bg-teal-500/10 text-teal-400 border border-teal-500/20">Mobilní UX Mockupy</span>
                </h1>
                <p className="text-xs text-slate-400">Interaktivní simulace výběru cestujících a vyhledávání spojení</p>
              </div>
            </div>

            <div className="flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800">
              <button
                onClick={() => setSelectedApp('vy')}
                className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 ${
                  selectedApp === 'vy' ? 'bg-teal-500 text-slate-950 font-bold shadow-md shadow-teal-500/20' : 'text-slate-400 hover:text-white'
                }`}
              >
                <span>🇳🇴 Vy.no (Android)</span>
                <span className="w-2 h-2 rounded-full bg-emerald-300 animate-pulse"></span>
              </button>
              <button
                onClick={() => setSelectedApp('db')}
                className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                  selectedApp === 'db' ? 'bg-teal-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'
                }`}
              >
                🇩🇪 DB Navigator
              </button>
              <button
                onClick={() => setSelectedApp('idos')}
                className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                  selectedApp === 'idos' ? 'bg-teal-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'
                }`}
              >
                🇨🇿 IDOS Koncept
              </button>
            </div>

            <div className="flex items-center gap-1 text-xs">
              <span className="text-slate-400 mr-1 hidden sm:inline">Krok:</span>
              <button onClick={() => setScreen('search')} className={`px-2.5 py-1 rounded-md transition ${screen === 'search' ? 'bg-slate-700 text-white font-medium' : 'text-slate-400 hover:bg-slate-800'}`}>1. Hledání</button>
              <button onClick={() => setScreen('results')} className={`px-2.5 py-1 rounded-md transition ${screen === 'results' ? 'bg-slate-700 text-white font-medium' : 'text-slate-400 hover:bg-slate-800'}`}>2. Výsledky</button>
              <button onClick={() => setScreen('passengers')} className={`px-2.5 py-1 rounded-md transition ${screen === 'passengers' ? 'bg-teal-500/20 text-teal-300 font-medium border border-teal-500/30' : 'text-slate-400 hover:bg-slate-800'}`}>3. Výběr cestujících</button>
              <button onClick={() => setScreen('cart')} className={`px-2.5 py-1 rounded-md transition ${screen === 'cart' ? 'bg-slate-700 text-white font-medium' : 'text-slate-400 hover:bg-slate-800'}`}>4. Košík / Detail</button>
            </div>
          </header>

          <main className="flex-1 max-w-7xl mx-auto w-full p-4 md:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            <div className="lg:col-span-5 xl:col-span-5 flex flex-col items-center">
              <div className="w-[370px] h-[780px] bg-vy-bg rounded-[42px] border-[9px] border-slate-800 phone-frame overflow-hidden flex flex-col relative shadow-2xl">
                <div className="bg-transparent px-6 pt-3 pb-1 flex justify-between items-center text-[12px] font-semibold tracking-wider text-vy-text/80 select-none z-20">
                  <span>11:24</span>
                  <div className="flex items-center gap-1.5 text-[11px]">
                    <span className="text-[10px] font-bold">5G</span>
                    <svg className="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm0 13c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/></svg>
                    <div className="w-5 h-2.5 border border-vy-text/60 rounded-sm p-0.5 flex items-center">
                      <div className="w-3 h-full bg-vy-text/80 rounded-2xs"></div>
                    </div>
                  </div>
                </div>

                <div className="flex-1 overflow-y-auto relative flex flex-col">
                  {selectedApp === 'vy' ? (
                    <>
                      {screen === 'search' && (
                        <VySearchScreen onSearch={() => setScreen('results')} onOpenPassengers={() => setScreen('passengers')} passengersSummary={getSummaryString()} />
                      )}
                      {screen === 'results' && (
                        <VyResultsScreen
                          trips={trips}
                          onBack={() => setScreen('search')}
                          onOpenPassengers={() => setScreen('passengers')}
                          passengersSummary={getSummaryString()}
                          calcPrice={calculateTotalPrice}
                          onSelectTrip={(trip) => { setSelectedTrip(trip); setScreen('cart'); }}
                        />
                      )}
                      {screen === 'passengers' && (
                        <VyPassengersModal
                          passengers={passengers}
                          setPassengers={setPassengers}
                          options={options}
                          setOptions={setOptions}
                          onClose={() => setScreen('results')}
                          onSave={() => setScreen('results')}
                        />
                      )}
                      {screen === 'cart' && (
                        <VyCartScreen
                          trip={selectedTrip || trips[0]}
                          passengers={passengers}
                          options={options}
                          totalNok={calculateTotalPrice(selectedTrip ? selectedTrip.basePrice : 399)}
                          onBack={() => setScreen('results')}
                          onOpenPassengers={() => setScreen('passengers')}
                        />
                      )}
                    </>
                  ) : selectedApp === 'db' ? (
                    <DBNavigatorPreview onSwitchToVy={() => setSelectedApp('vy')} />
                  ) : (
                    <IdosConceptPreview onSwitchToVy={() => setSelectedApp('vy')} />
                  )}
                </div>

                <div className="h-6 bg-vy-bg flex items-center justify-center py-2 z-20">
                  <div className="w-28 h-1 bg-white/30 rounded-full"></div>
                </div>
              </div>

              <button
                onClick={() => {
                  setPassengers({ adult: 1, child: 0, childAge: '', student: 0, studentAge: '', senior: 0, military: 0 });
                  setOptions({ bike: 0, pram: 0, wheelchair: 0, petSmall: 0, petBig: 0 });
                  setScreen('results');
                }}
                className="mt-4 text-xs text-slate-400 hover:text-teal-400 transition flex items-center gap-1.5 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg"
              >
                <span>↺ Obnovit výchozí stav (1 dospělý)</span>
              </button>
            </div>

            <div className="lg:col-span-7 xl:col-span-7 space-y-6">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-4 mb-4">
                  <div className="flex items-center gap-2">
                    <span className="w-3 h-3 rounded-full bg-teal-400"></span>
                    <h2 className="font-semibold text-white">Živý stav aplikace: Vy.no (Android)</h2>
                  </div>
                  <span className="text-xs px-2.5 py-1 bg-slate-800 text-slate-300 rounded-md font-mono">
                    Obrazovka: {screen.toUpperCase()}
                  </span>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 text-sm">
                  <div className="bg-slate-950/70 p-3 rounded-xl border border-slate-800/80">
                    <span className="text-xs text-slate-400 block mb-1">Cestující:</span>
                    <span className="font-medium text-teal-300">{getSummaryString()}</span>
                  </div>
                  <div className="bg-slate-950/70 p-3 rounded-xl border border-slate-800/80">
                    <span className="text-xs text-slate-400 block mb-1">Doplňky (kolo/pes):</span>
                    <span className="font-medium text-slate-200">
                      {options.bike > 0 && `${options.bike}x kolo `}
                      {options.petBig > 0 && `${options.petBig}x pes `}
                      {options.pram > 0 && `${options.pram}x kočárek `}
                      {options.bike === 0 && options.petBig === 0 && options.pram === 0 && 'Žádné'}
                    </span>
                  </div>
                  <div className="bg-slate-950/70 p-3 rounded-xl border border-slate-800/80">
                    <span className="text-xs text-slate-400 block mb-1">Kalkulovaná cena (spoj 1):</span>
                    <span className="font-bold text-lg text-emerald-400">{calculateTotalPrice(399)} NOK</span>
                  </div>
                </div>

                <div className="mt-4 pt-4 border-t border-slate-800/70 flex flex-wrap items-center gap-2">
                  <span className="text-xs text-slate-400">Rychlé scénáře k vyzkoušení:</span>
                  <button
                    onClick={() => {
                      setPassengers({ adult: 1, child: 1, childAge: '7', student: 0, studentAge: '', senior: 0, military: 0 });
                      setScreen('results');
                    }}
                    className="text-xs px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition"
                  >
                    1 Dospělý + Dítě (7 let)
                  </button>
                  <button
                    onClick={() => {
                      setPassengers({ adult: 1, child: 1, childAge: '10', student: 1, studentAge: '21', senior: 0, military: 0 });
                      setScreen('passengers');
                    }}
                    className="text-xs px-2.5 py-1 rounded bg-teal-900/40 hover:bg-teal-900/60 text-teal-300 border border-teal-700/50 transition"
                  >
                    Dítě + Student (otevře dialog s věkem)
                  </button>
                  <button
                    onClick={() => {
                      setPassengers({ adult: 2, child: 0, childAge: '', student: 0, studentAge: '', senior: 0, military: 0 });
                      setOptions(prev => ({ ...prev, bike: 2 }));
                      setScreen('results');
                    }}
                    className="text-xs px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition"
                  >
                    2 Dospělí + 2 Kola
                  </button>
                </div>
              </div>

              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                <h3 className="font-bold text-white text-base flex items-center gap-2">
                  <span>💡</span> Klíčové principy zjištěné u aplikace Vy (Android)
                </h3>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="p-4 rounded-xl bg-slate-950/60 border border-slate-800 space-y-2">
                    <div className="text-teal-400 font-semibold text-sm flex items-center gap-2">
                      <span className="w-5 h-5 rounded-full bg-teal-500/20 flex items-center justify-center text-xs">1</span>
                      Kompaktní záhlaví ve výsledcích
                    </div>
                    <p className="text-xs text-slate-300 leading-relaxed">
                      Po vyhledání spojení uživatel okamžitě vidí výsledky a <strong>stačí jen scrollovat dolů</strong>. V záhlaví zůstává trasa, čas i řádek <code>Passenger: 1 adult</code>. Kliknutím na něj se přímo otevře modální výběr bez nutnosti opustit výsledky.
                    </p>
                  </div>

                  <div className="p-4 rounded-xl bg-slate-950/60 border border-slate-800 space-y-2">
                    <div className="text-teal-400 font-semibold text-sm flex items-center gap-2">
                      <span className="w-5 h-5 rounded-full bg-teal-500/20 flex items-center justify-center text-xs">2</span>
                      Progresivní zadání věku
                    </div>
                    <p className="text-xs text-slate-300 leading-relaxed">
                      Vstupní pole pro věk se u <em>Child/youth</em> a <em>Student</em> neukazuje zbytečně předem. Zobrazí se dynamicky až po navýšení počtu na 1+. Aplikace transparentně vysvětluje důvod (různé věkové limity různých dopravců).
                    </p>
                  </div>

                  <div className="p-4 rounded-xl bg-slate-950/60 border border-slate-800 space-y-2">
                    <div className="text-teal-400 font-semibold text-sm flex items-center gap-2">
                      <span className="w-5 h-5 rounded-full bg-teal-500/20 flex items-center justify-center text-xs">3</span>
                      Doplňky v jednom toku
                    </div>
                    <p className="text-xs text-slate-300 leading-relaxed">
                      Kolo, kočárek, zvířata i invalidní vozík nejsou schované v separátních podmenu, ale jsou umístěny přímo pod seznamem cestujících se stejným intuitivním ovládáním <code>−</code> / <code>+</code>.
                    </p>
                  </div>

                  <div className="p-4 rounded-xl bg-slate-950/60 border border-slate-800 space-y-2">
                    <div className="text-teal-400 font-semibold text-sm flex items-center gap-2">
                      <span className="w-5 h-5 rounded-full bg-teal-500/20 flex items-center justify-center text-xs">4</span>
                      Inspirace pro IDOS
                    </div>
                    <p className="text-xs text-slate-300 leading-relaxed">
                      V IDOSu by tento model umožnil zachovat stávající podporu více průkazů, ale zbavit se těžkopádného formuláře. Uživatel by v přehledném dialogu viděl počet osob a jejich slevy, přičemž ceny ve výsledcích by byly hned přesné.
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    }
    function VySearchScreen({ onSearch, onOpenPassengers, passengersSummary }) {
      return (
        <div className="flex-1 flex flex-col bg-vy-bg text-vy-text p-4">
          <div className="flex bg-vy-card p-1 rounded-full mb-5 border border-vy-border/40">
            <button className="flex-1 py-2 rounded-full text-xs font-bold bg-vy-mint text-slate-950 shadow-sm transition">
              Find journey
            </button>
            <button className="flex-1 py-2 rounded-full text-xs font-semibold text-vy-subtext hover:text-vy-text transition">
              Departures
            </button>
          </div>

          <div className="bg-vy-card rounded-2xl p-4 border border-vy-border/60 shadow-lg space-y-4">
            <div className="flex items-center gap-3 pb-3 border-b border-vy-border/40">
              <div className="text-vy-mint">
                <svg className="w-5 h-5 rotate-45" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
              </div>
              <div className="flex-1">
                <div className="text-[11px] text-vy-subtext font-medium">Travel from</div>
                <div className="text-sm font-semibold text-vy-text">My position</div>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <div className="text-vy-subtext">
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
